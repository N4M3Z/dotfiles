# External content chezmoi places on apply.
# Reference: https://www.chezmoi.io/reference/special-files-and-directories/chezmoiexternal-format/
#
# Third-party code that tmux sources at startup is pinned: each external is an
# immutable archive at a release tag (or commit, for projects without
# releases) with a SHA-256 the download must match. Updates land through
# .github/workflows/externals-update.yaml, which runs
# .github/scripts/update-externals weekly and opens a pull request when a pin
# moves, so refreshes stay reviewable instead of executing silently.
#
# dotzsh stays type git-repo: it pulls submodules recursively, which archive
# externals do not include, and chezmoi offers no revision pin for git-repo.
# It is first-party code under the same ownership as this repository.

# dotzsh — Prezto fork. Cloned to ~/.zsh/ to match the convention used in
# the legacy stow-managed dotfiles (.zshrc sources ${ZDOTDIR:-$HOME}/.zsh/init.zsh).
[".zsh"]
    type = "git-repo"
    url = "https://github.com/N4M3Z/dotzsh.git"
    refreshPeriod = "168h"
    [".zsh".clone]
        args = ["--recursive"]
    [".zsh".pull]
        args = ["--ff-only"]

# tmux plugins sourced directly via run-shell in tmux.conf (no TPM runner).
# To add a plugin: add a pinned stanza here, add a run-shell line in
# dot_config/tmux/tmux.conf, run `chezmoi apply`, reload tmux.
# See forge-provision ARCH-0015 for the rationale behind dropping TPM.

[".config/tmux/plugins/tmux-resurrect"]
