# What agents may do, by place. A name this file does not grant is refused,
# and a missing or broken file refuses everything.
#
# For a name at a path, the top-level grant applies first, then every scope
# that contains the path from the outermost to the innermost: `only` replaces
# the answer, `grant` allows, `revoke` refuses. `disabled` refuses last and
# wins everywhere. A pattern ending in `.*` matches every name below it.
#
# Ask why: `bun ~/Developer/runedeck/jev/bin/jev.ts policy --path <dir>`.
# Turn names off for one session: RUNE_POLICY_DISABLE=jev.*
# Source: https://github.com/N4M3Z/dotfiles
version: 1

# Put `jev.*` here to stop every Jev call.
disabled: []

grant:
  # Where Jev may send text: TypeSafe's hosted model, or the local Ollama one.
  - jev.send.hosted
  - jev.send.local
  # The slop detector grades prose the agent writes and recommends a rewrite.
  - jev.slop-detector
  - jev.slop-detector.signal
  # A sloppy final reply continues the turn once, so the model rewrites it.
  - jev.slop-detector.rewrite

scopes:
  # Work repositories: Jev does not run, and nothing goes to TypeSafe.
  - path: ~/Developer/proton
    only: []

  # Personal notes stay on the machine: the local model only.
  - path: ~/Atlas
    revoke: [jev.send.hosted]
