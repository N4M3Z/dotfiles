# Host catch-all pack. One-off rules for this machine that fit no other pack
# and no runedeck repository go here. A rule that turns out to matter in every
# repository moves to the skeleton (.dcg/packs/, SKEL-0009). Replaces
# forge.yaml, whose only rule guarded a CLI that is no longer used.
# Validate: dcg pack validate ~/.config/dcg/packs/other.yaml
# Schema: https://github.com/Dicklesworthstone/destructive_command_guard/blob/main/docs/pack.schema.yaml
schema_version: 1
id: user.other
name: Host Other Rules
version: 1.0.0

description: |
  Host-local rules that fit no other pack. Add a destructive pattern with
  a name, a fancy-regex pattern, a severity, and an explanation that tells
  the agent what to run instead.

keywords:
  - pbcopy
  - pbpaste
  - gh

destructive_patterns:
  # The sandbox blocks the pasteboard, and the harness has its own /copy.
  # An agent that pipes into pbcopy gets an error it then works around.
  - name: pbcopy-in-sandbox
    pattern: '\bpb(copy|paste)\b'
    severity: low
    description: The sandbox has no pasteboard. Put the text in a fenced block and let the user run /copy.
    explanation: |
      pbcopy and pbpaste fail under the command sandbox. Print the text in
      a fenced code block instead; the harness copies it from outside the
      sandbox with /copy.

  # `gh *` is excluded from the command sandbox, but the exclusion covers a
  # bare command only. Inside a pipe, a command substitution, or a loop the
  # whole line runs sandboxed, where Go cannot reach trustd and every TLS
  # handshake fails with OSStatus -26276 (claude-code#34876, closed). Block
  # the chained forms so the fix is obvious instead of a mystery TLS error.
  - name: gh-in-pipeline
    pattern: '(?:^|[\s(;&])(?:rtk\s+)?gh\s+(?:[^|''"\n]|''[^'']*''|"[^"]*")*\|'
    severity: medium
    description: gh runs sandboxed inside a pipe and fails TLS. Filter with --jq or --json and run gh alone.
    explanation: |
      The sandbox exclusion for gh applies to a bare command. A pipe after gh
      puts the whole line in the sandbox, where Go TLS verification fails.
      Use `gh ... --json <fields> --jq '<filter>'` for the filtering, or write
      the output to a file in a separate call.
  - name: gh-in-loop
    pattern: '\b(?:for|while)\b[^\n]*\b(?:rtk\s+)?gh\s'
    severity: medium
    description: gh runs sandboxed inside a loop and fails TLS. Run one bare gh per call.
    explanation: |
      A loop runs the whole line inside the sandbox, where gh cannot verify
      TLS. Run gh alone with -R owner/repo, capture the output in a file, and
      loop over the file in a second call. dcg evaluates a $( ) substitution
      on its own, so that form is not caught here: the same rule applies.
