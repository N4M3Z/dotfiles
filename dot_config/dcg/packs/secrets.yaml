# Host secret-read guard. The same rule lives in every runedeck repository as
# rune.secrets (skeleton SKEL-0009), but a repository pack binds only under
# that repository's root. This copy keeps `cat ~/.env` or `cat ~/.ssh/id_rsa`
# denied from any directory. The repository pins rune.secrets to deny and
# nothing relaxes either copy, so the two never disagree.
# Validate: dcg pack validate ~/.config/dcg/packs/secrets.yaml
schema_version: 1
id: user.secrets
name: Host Secret Reads
version: 1.0.0

description: |
  Blocks a casual read of key files and environment files from any
  directory. An agent that needs one value states the reason and the exact
  variable, and the user reads or pastes it.

keywords:
  - .env
  - id_rsa
  - id_ed25519
  - .pem
  - .key
  - Keychains

destructive_patterns:
  - name: casual-secret-read
    pattern: '^(cat|less|more|head|tail|bat)\s+[^|;&]*(\.env\b|id_rsa\b|id_ed25519\b|\.pem\b|\.key\b|/Library/Keychains)'
    severity: high
    description: Read secret material deliberately, never casually.
    explanation: |
      Key files and environment files hold credentials. An agent that
      needs one value must state the reason and the exact variable, and
      the user reads or pastes it. Bulk reads leak whole credential
      sets into context and logs.
    executables:
      - cat
      - less
      - more
      - head
      - tail
      - bat

safe_patterns:
  - name: env-example-read
    # Every operand must be an example file, so `cat .env.example .env`
    # stays denied. Options and their numeric values (-n 20) are permitted.
    pattern: '^(cat|less|more|head|tail|bat)(\s+(-\S+|[0-9]+|\S*\.env\.(example|sample|template)))+\s*$'
    description: Example environment files contain no secrets.
