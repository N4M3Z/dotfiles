# tmux.conf — Ghostty + Claude Code (Agent Teams) compatibility.
# Reference: https://github.com/tmux/tmux/wiki
# Reload: `tmux source-file ~/.config/tmux/tmux.conf` or `prefix : source-file ~/.config/tmux/tmux.conf`.

# Inside-tmux terminal; outside features added per-terminal below.
set -g default-terminal "tmux-256color"

# Ghostty sets COLORTERM=truecolor in its process env, but tmux's default
# update-environment list does not include COLORTERM, so inner shells lose it.
# Programs that check COLORTERM (Claude Code, bat, delta, eza) fall back to
# 256-color without this. set-environment -g is deterministic regardless of
# how the session was created.
set-environment -g COLORTERM truecolor

# Belt-and-braces truecolor: terminal-features RGB is the modern declaration,
# terminal-overrides Tc is the legacy one. Some programs check one or the other.
set -as terminal-overrides ",*-256color:Tc"

# Tell tmux that the outside terminal (Ghostty) supports these features.
# extkeys = kitty keyboard protocol — required for Claude Code's Shift+Enter,
# Ctrl+arrow, and Option+letter combos to survive the tmux pane.
# clipboard = OSC 52 pass-through so /copy works inside Claude Code over SSH+tmux.
set -ga terminal-features "xterm*:RGB:clipboard:ccolour:cstyle:focus:title:extkeys"

# Advertise extended keys outward (the matching feature flag above is the
# inward half — both are needed).
set -s extended-keys on

# OSC 52 clipboard write.
set -g set-clipboard on

# Title forwarding so Ghostty's titlebar reflects session/window.
set -g set-titles on
set -g set-titles-string "#S / #W"

# Vim/Neovim focus tracking.
set -g focus-events on

# Mouse for drag-resize, scroll, pane click.
set -g mouse on

# Don't swallow Escape — matters for vim and Claude Code's TUI.
set -s escape-time 10

# Larger scrollback per pane (Claude Code emits a lot).
set -g history-limit 100000

# 1-indexed windows/panes, contiguous renumbering on close.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vim-style pane navigation under the prefix table.
bind -T prefix h select-pane -L
bind -T prefix j select-pane -D
bind -T prefix k select-pane -U
bind -T prefix l select-pane -R

# Non-prefix Alt+hjkl pane navigation. One keystroke, no prefix dance.
# Most useful inside Claude Code agent-team sessions where panes are the unit.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Splits inherit cwd (matches Claude Code --worktree mental model).
bind -T prefix '|' split-window -h -c "#{pane_current_path}"
bind -T prefix '-' split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ---- display-popup (fzf integration, no plugins needed) ------------------

# fzf session switcher in a floating popup.
bind s display-popup -E -w 80% -h 80% \
    "tmux list-sessions -F '#{session_name}' | fzf --reverse | xargs tmux switch-client -t"

# Inline gitui anchored to pane cwd.
bind -n M-g display-popup -h 80% -w 80% -d '#{pane_current_path}' -E 'gitui'

# Scratch shell popup for one-off commands.
bind -n M-t display-popup -E -w 60% -h 60%

# ---- plugins (direct sourcing, no TPM) ----------------------------------
# Plugins cloned by chezmoi externals (.chezmoiexternal.toml), sourced
# directly here via run-shell. No TPM runner, no prefix+I, no startup lag
# from TPM's plugin-discovery loop. See ARCH-0015.

# catppuccin — source BEFORE any @catppuccin_* option references.
run-shell '~/.config/tmux/plugins/catppuccin/catppuccin.tmux'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_default_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g status-left ''
set -g status-right '#{E:@catppuccin_status_application}#{E:@catppuccin_status_session}'

# tmux-resurrect — prefix+Ctrl-s save, prefix+Ctrl-r restore.
run-shell '~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux'

# tmux-continuum — auto-save every 15 min, auto-restore on start.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
run-shell '~/.config/tmux/plugins/tmux-continuum/continuum.tmux'

# tmux-fingers — hint-based copy (prefix+F). Active (v2.6.2, Feb 2026).
run-shell '~/.config/tmux/plugins/tmux-fingers/tmux-fingers.tmux'

# ---- TPM (disabled, kept for reference) ---------------------------------
# TPM was dropped at the end of 2025 in favor of direct run-shell sourcing above.
# Rationale (ARCH-0015): TPM's last merged PR was 2023-02 (maintenance
# stalled), documented 8-10s startup lag with 3 plugins (issue #257),
# catppuccin alone added ~1s via TPM's discovery loop (issue #258). chezmoi
# externals already handled the git cloning; TPM's only remaining job was
# sourcing *.tmux entry scripts, which run-shell does natively with zero
# overhead. To re-enable TPM, uncomment the lines below, add the TPM block
# back to .chezmoiexternal.toml, and remove the run-shell lines above.
#
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'catppuccin/tmux'
# run '~/.config/tmux/plugins/tpm/tpm'
