# tmux.conf — Ghostty + Claude Code (Agent Teams) compatibility.
# Reference: https://github.com/tmux/tmux/wiki
# Reload: `tmux source-file ~/.config/tmux/tmux.conf` or `prefix : source-file ~/.config/tmux/tmux.conf`.

# Inside-tmux terminal; outside features added per-terminal below.
set -g default-terminal "tmux-256color"

# Ghostty sets COLORTERM=truecolor in its process env, but tmux's default
# update-environment list does not include COLORTERM, so inner shells lose it.
# Programs that check COLORTERM (Claude Code, bat, delta, eza) fall back to
# 256-color without this. set-environment -g is deterministic regardless of
# how the session was created.
set-environment -g COLORTERM truecolor

# Belt-and-braces truecolor: terminal-features RGB is the modern declaration,
# terminal-overrides Tc is the legacy one. Some programs check one or the other.
set -as terminal-overrides ",*-256color:Tc"

# Tell tmux that the outside terminal (Ghostty) supports these features.
# extkeys = kitty keyboard protocol — required for Claude Code's Shift+Enter,
# Ctrl+arrow, and Option+letter combos to survive the tmux pane.
# clipboard = OSC 52 pass-through so /copy works inside Claude Code over SSH+tmux.
set -ga terminal-features "xterm*:RGB:clipboard:ccolour:cstyle:focus:title:extkeys"

# Advertise extended keys outward (the matching feature flag above is the
# inward half — both are needed).
set -s extended-keys on

# OSC 52 clipboard write.
set -g set-clipboard on

# Title forwarding so Ghostty's titlebar reflects session/window.
set -g set-titles on
set -g set-titles-string "#S / #W"

# Vim/Neovim focus tracking.
set -g focus-events on

# Mouse for drag-resize, scroll, pane click.
set -g mouse on

# Don't swallow Escape — matters for vim and Claude Code's TUI.
set -s escape-time 10

# Larger scrollback per pane (Claude Code emits a lot).
set -g history-limit 100000

# 1-indexed windows/panes, contiguous renumbering on close.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vim-style pane navigation under the prefix table.
bind -T prefix h select-pane -L
bind -T prefix j select-pane -D
bind -T prefix k select-pane -U
bind -T prefix l select-pane -R

# Non-prefix Alt+hjkl pane navigation. One keystroke, no prefix dance.
# Most useful inside Claude Code agent-team sessions where panes are the unit.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Splits inherit cwd (matches Claude Code --worktree mental model).
bind -T prefix '|' split-window -h -c "#{pane_current_path}"
bind -T prefix '-' split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ---- display-popup (fzf integration, no plugins needed) ------------------

# fzf session switcher in a floating popup.
bind s display-popup -E -w 80% -h 80% \
    "tmux list-sessions -F '#{session_name}' | fzf --reverse | xargs tmux switch-client -t"

# Inline gitui anchored to pane cwd.
bind -n M-g display-popup -h 80% -w 80% -d '#{pane_current_path}' -E 'gitui'

# Cheatsheet popup: prompts for a command, shows tldr (falls back to cht.sh).
# Reclaims prefix+/ from the default describe-single-key helper (prefix+? still
# lists all bindings).
bind / display-popup -E -w 70% -h 70% "$HOME/.local/bin/tmux-popup cheat"

# Scratch shell popup, persistent: the popup hosts a detached "scratch"
# session, so dismissing it keeps everything running — M-t toggles it back.
# Inside the popup, M-t detaches (= closes the popup); the status bar is off
# there since the popup border already frames it.
bind -n M-t if -F '#{==:#{session_name},scratch}' 'detach-client' \
    'display-popup -E -w 60% -h 60% "tmux new-session -A -s scratch \; set status off"'

# Agent windows picker: fzf over windows flagged by claude-tmux-status
# (Claude Code hooks); Enter jumps to the window that needs you.
bind u display-popup -E -w 60% -h 50% "$HOME/.local/bin/tmux-agents"

# ---- plugins (direct sourcing, no TPM) ----------------------------------
# Plugins cloned by chezmoi externals (.chezmoiexternal.toml), sourced
# directly here via run-shell. No TPM runner, no prefix+I, no startup lag
# from TPM's plugin-discovery loop. See ARCH-0015.

# ---- status bar theme ----------------------------------------------------
# Exactly one theme file is sourced here; both live next to this file.
#   theme-theo.conf   flat blocks, per-host accent, dense stats (active)
#   theme-pills.conf  catppuccin rounded pills
# Switch: point the source-file below at the other theme, then reload the
# whole config (`tmux source-file ~/.config/tmux/tmux.conf`). A full reload
# matters: continuum re-wraps status-right for autosave afterwards.
source-file ~/.config/tmux/theme-theo.conf

# ---- clickable status bar -------------------------------------------------
# The theo theme wraps four segments in range=user regions; this handler
# dispatches on which was clicked, falling through to window-select for the
# window list. The pills theme has no user ranges, so clicks there just
# select windows. Popup bodies for sesh/cal live in ~/.local/bin/tmux-popup.
bind -T root MouseDown1Status {
    if -F '#{==:#{mouse_status_range},sesh}'  'display-popup -E -w 62% -h 62% "$HOME/.local/bin/tmux-popup sesh"' {
    if -F '#{==:#{mouse_status_range},vcs}'   'display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "$HOME/.local/bin/tmux-vcs"' {
    if -F '#{==:#{mouse_status_range},cal}'   'display-popup -E -w 30% -h 42% "$HOME/.local/bin/tmux-popup cal"' {
    if -F '#{==:#{mouse_status_range},btop}'  'display-popup -E -w 80% -h 80% btop' {
    if -F '#{==:#{mouse_status_range},neww}'  'new-window' \
    'select-window -t=' }}}}
}

# Window management on the bar (a user range can't live inside the window
# list, so these use native window gestures): drag a window to reorder it;
# middle-click a window to close it (browser-tab convention, the ✕ is the
# cue); right-click a window for the kill/rename/move menu (tmux default);
# right-click the host block for the new-session/new-window menu (default).
bind -T root MouseDrag1Status swap-window -t=
bind -T root MouseDown2Status kill-window -t=

# tmux-resurrect — prefix+Ctrl-s save, prefix+Ctrl-r restore.
# Pane text is captured so restored panes show what was on screen.
# Restored programs: claude panes relaunch through claude-revive, which
# resumes the exact session bound to the window by claude-tmux-status
# (fallbacks: newest session in the cwd, then a fresh claude); btop and
# gitui are stateless and just relaunch.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes '"~claude->claude-revive" btop gitui'
run-shell '~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux'

# tmux-continuum — auto-save every 5 min, auto-restore on start. A crash
# costs at most 5 minutes of layout drift; prefix+Ctrl-s before an
# intentional reboot still beats any interval.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
run-shell '~/.config/tmux/plugins/tmux-continuum/continuum.tmux'

# tmux-fingers — hint-based copy (prefix+F). Active (v2.6.2, Feb 2026).
run-shell '~/.config/tmux/plugins/tmux-fingers/tmux-fingers.tmux'

# extrakto — prefix+Tab: fzf-grab any path, URL, or word from the pane and
# scrollback, then paste or copy it. Needs fzf (present).
run-shell '~/.config/tmux/plugins/extrakto/extrakto.tmux'

# ---- TPM (disabled, kept for reference) ---------------------------------
# TPM was dropped at the end of 2025 in favor of direct run-shell sourcing above.
# Rationale (ARCH-0015): TPM's last merged PR was 2023-02 (maintenance
# stalled), documented 8-10s startup lag with 3 plugins (issue #257),
# catppuccin alone added ~1s via TPM's discovery loop (issue #258). chezmoi
# externals already handled the git cloning; TPM's only remaining job was
# sourcing *.tmux entry scripts, which run-shell does natively with zero
# overhead. To re-enable TPM, uncomment the lines below, add the TPM block
# back to .chezmoiexternal.toml, and remove the run-shell lines above.
#
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'catppuccin/tmux'
# run '~/.config/tmux/plugins/tpm/tpm'
