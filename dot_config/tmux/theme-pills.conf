# Catppuccin rounded pills. Selected from tmux.conf's "status bar theme"
# block — switch there, not here.
# Options are set BEFORE the plugin runs so its style branch sees them; the
# plugin owns status-style and the window pills.
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
# The leading conditional renders the claude-tmux-status agent flag inside
# the pill: ◉ = agent needs you, ● = agent working, nothing = no agent.
set -g @catppuccin_window_default_text ' #{?#{==:#{@agent},attention},◉ ,#{?#{==:#{@agent},working},● ,}}#W'
set -g @catppuccin_window_current_text ' #{?#{==:#{@agent},attention},◉ ,#{?#{==:#{@agent},working},● ,}}#W'
run-shell '~/.config/tmux/plugins/catppuccin/catppuccin.tmux'

# Redraw cadence and component lengths at tmux defaults; only the two bar
# ends are set here (the other theme changes all three, so switching back
# must reset them).
set -g status-interval 15
set -g status-left-length 10
set -g status-right-length 40
set -g status-left ''
set -g status-right '#{E:@catppuccin_status_application}#{E:@catppuccin_status_session}'
