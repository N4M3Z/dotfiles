#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Martin Zeman"
email = "N4M3Z@users.noreply.github.com"

[signing]
backend = "gpg"
# "drop" keeps jj from signing every working-copy snapshot, which is especially
# inconvenient when the private key is stored on a YubiKey; git.sign-on-push
# below signs the pushed commits in one batch instead. This reduces everything
# to one touch per push, and pushed commits are still marked as "verified".
behavior = "drop"
key = "0x29DD2145CE7A818929459B2649F08103D3DA399E"

[git]
sign-on-push = true

[aliases]
push = ["util", "exec", "--", "bash", "-c", "cd \"$(jj workspace root)\" && if [ -x .githooks/jj-push ]; then exec .githooks/jj-push \"$@\"; else exec jj git push \"$@\"; fi", "jj-push"]
# Move the nearest ancestor bookmark up to @- , ready to push.
tug = ["bookmark", "move", "--from", "closest_bookmark(@-)", "--to", "@-"]

[revset-aliases]
'closest_bookmark(to)' = 'heads(::to & bookmarks())'

# `jj fix` auto-repair rung of the gate ladder (deck DECK-0010): format
# and spelling fixes rewrite changed files in revisions before the push
# gate sees them. Tools read stdin and write the fixed content to stdout.
# Caution: the tools do not resolve repository excludes over stdin, and
# jj fix only touches files changed in the fixed revisions. A change to
# a digest-bound adopted file therefore gets reformatted, but such an
# edit already implies digest churn through the adaptation flow.
[fix.tools.rumdl]
command = ["rumdl", "fmt", "--stdin-filename", "$path", "-"]
patterns = ["glob:'**/*.md'"]

[fix.tools.typos]
command = ["typos", "--write-changes", "-"]
patterns = ["glob:'**/*.md'", "glob:'**/*.sh'", "glob:'**/*.rs'", "glob:'**/*.toml'", "glob:'**/*.yaml'", "glob:'**/*.yml'"]

[fix.tools.shfmt]
command = ["shfmt"]
patterns = ["glob:'**/*.sh'"]

[colors]
# jjui renders jj's own diff output; the default underline on changed
# tokens reads terribly there, so color alone carries the word-level
# emphasis.
"diff added token" = { underline = false }
"diff removed token" = { underline = false }
