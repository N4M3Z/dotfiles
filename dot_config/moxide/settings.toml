# markdown-oxide (Obsidian-style PKM language server) global config.
# Read by the oxide LSP binary that the Zed "Markdown Oxide" extension bundles;
# Zed does not pass these through settings.json, oxide reads this file directly.
# Lives at ~/.config/moxide/settings.toml (global) or .moxide.toml (per vault).
#
# Deliberately minimal. Inside an Obsidian vault (Atlas), oxide imports the
# daily-notes folder, new-file location, and date format from .obsidian, so
# those are left unset here. Its useful defaults are already on: `![[embed]]`
# transclusion as inlay hints, unresolved-wikilink diagnostics, semantic
# tokens, and backlinks-on-hover. This global file extends the same wikilink
# completion and backlinks to non-vault markdown (forge ADRs, journals, skills).
#
# Reference: https://oxide.md  ·  Source: https://github.com/N4M3Z/forge-provision

# Daily-note filename format for the Today / Tomorrow / Daily LSP commands.
# Pinned to the house date convention so the commands stay deterministic in
# repos that have no Obsidian config to import from. Inside Atlas, the vault's
# own YYYY-MM-DD setting is imported and matches this anyway.
dailynote = "%Y-%m-%d"

# Skip archive, attachment, and template directories when indexing, so they
# stay out of completions, backlinks, and workspace symbols. Matched by
# directory name at any depth; the capitalized names target the Atlas vault and
# do not collide with forge's lowercase template/ dirs. Requires a recent oxide.
excluded_folders = ["Archives", "Assets", "Templater", "Templates", ".trash"]

# Tunables left at their defaults, surfaced here as the menu for later edits
# (full inventory, verified against markdown-oxide src/config.rs):
#   hover = true                       # backlinks/preview on mouse hover (Zed: set false if noisy)
#   block_transclusion = true          # render ![[embed]] as inlay hints
#   block_transclusion_length = "Full" # or a partial length to truncate embeds
#   inlay_hints = true                 # master switch for the transclusion hints
#   unresolved_diagnostics = true      # flag broken [[wikilinks]] (high value across renamed ADRs)
#   heading_completions = true         # [[note#heading]] completion targets
#   title_headings = true              # treat the H1 as the note title in completions
#   callout_completions = true         # > [!callout] type completions
#   semantic_tokens = true             # wikilink highlighting (auto-off where unsupported)
#   case_matching = "Smart"            # fuzzy-match case handling ("Ignore" | "Respect")
#   link_filenames_only = false        # complete by heading but insert a filename-only link (Zettelkasten)
#   heading_slug = false               # GitHub-style dashed heading anchors in completions
#   tags_in_codeblocks = false         # index #tags inside fenced blocks (noise in code)
#   references_in_codeblocks = false   # index [[links]] inside fenced blocks (noise in code)
#   include_md_extension_md_link = false   # append .md inside [](file) links
#   include_md_extension_wikilink = false  # append .md inside [[wikilinks]]
#   daily_notes_folder = ""            # blank imports from Obsidian (Atlas: Journal/Daily)
#   new_file_folder_path = ""          # blank imports from Obsidian "new note location"
