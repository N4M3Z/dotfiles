{{- /* chezmoi:modify-template */ -}}
{{- $config := dict "schema_version" 7 -}}
{{- if ne (trim .chezmoi.stdin) "" -}}
{{- $config = fromToml .chezmoi.stdin -}}
{{- end -}}
{{- if and (hasKey $config "app_settings") (not (kindIs "map" (get $config "app_settings"))) -}}
{{- fail "OpenLogi app_settings must be a TOML table." -}}
{{- end -}}
{{- $preferences := dict
    "launch_at_login" true
    "check_for_updates" true
    "auto_install_updates" false
    "show_in_menu_bar" true
    "capture_mouse_events" true
    "smooth_scroll" false
    "vertical_scroll_sensitivity" 14
    "app_icon" "openlogi"
    "auto_download_assets" true
    "asset_source" "automatic"
    "thumbwheel_sensitivity" 14
    "appearance" "system"
    "ui_scale" "normal"
    "device_view_mode" "grid"
-}}
{{- range $key, $value := $preferences -}}
{{- $config = setValueAtPath (list "app_settings" $key) $value $config -}}
{{- end -}}
{{ $config | toToml }}
