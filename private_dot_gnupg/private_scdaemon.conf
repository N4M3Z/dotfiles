# ~/.gnupg/scdaemon.conf — managed by chezmoi (private_dot_gnupg/private_scdaemon.conf).
#
# GnuPG 2.3+ no longer falls back to PC/SC on its own (T4673), and macOS's
# CryptoTokenKit holds the USB device, so without disable-ccid the card is
# invisible to gpg. GnuPG 2.2 (GPG Suite) fell back automatically, which is
# why setups without this file used to work.
# Decision: docs/decisions/GPG-0001 GPG on YubiKey.md (forge-provision)

disable-ccid

# Uncomment if gpg --card-status reports a sharing violation: opens the card
# in shared mode alongside CryptoTokenKit.
#pcsc-shared
