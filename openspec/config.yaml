schema: spec-driven

context: |
  This repository manages user configuration with Chezmoi. Edit only source files.
  The user reviews rendered changes and runs `chezmoi apply` after approval.
  Codex Desktop reads ~/.codex/config.toml through its bundled Codex executable.
  Terminal Codex resolves the Chezmoi-managed ~/.local/bin/codex wrapper.
  Architecture decisions use ForgeADR files in docs/decisions/ with the DOT prefix.
  Preserve unrelated staged, unstaged, and untracked work.

rules:
  proposal:
    - Cite each architecture decision that the change adds or supersedes.
    - Separate source configuration changes from live Chezmoi application.
  specs:
    - Define provider routing for each launcher and each explicit bypass.
    - Keep credentials out of tracked files and command arguments.
    - Do not require a second CODEX_HOME for provider separation.
  design:
    - Make proxy failures explicit. Do not silently use a vendor endpoint.
    - Preserve direct vendor access through an explicit command or global off flag.
    - Preserve unrelated Codex profiles and existing dotfile changes.
  tasks:
    - Add `openspec` to .chezmoiignore before any rendered or live application.
    - Include syntax checks and a Chezmoi dry run.
    - Do not include `chezmoi apply`, staging, commits, or pushes.

operations:
  apply:
    guidance:
      - Preserve all unrelated staged, unstaged, and untracked files.
      - Stop after the rendered Chezmoi diff and verification results.
