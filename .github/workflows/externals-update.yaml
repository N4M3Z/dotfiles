name: externals-update

# Weekly pin refresh for the archive externals, matching the 168h cadence
# the git-repo externals used to have, routed through a reviewable pull
# request instead of silent code execution at apply time.
#
# Pull requests created with the default GITHUB_TOKEN do not trigger
# pull_request workflows: close and reopen the bump PR (or push to it) to
# run the required checks before merging.

on:
    schedule:
        - cron: "23 6 * * 1"
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Update pins
              id: update
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  bash .github/scripts/update-externals | tee update.log
                  if grep -qx "unchanged" update.log; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Open pull request
              if: steps.update.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  branch="chore/externals-$(date -u +%Y-%m-%d)"
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git switch -c "$branch"
                  git add .chezmoiexternal.toml
                  git commit -m "chore: bump pinned externals"
                  git push -u origin "$branch"
                  gh pr create \
                      --title "chore: bump pinned externals" \
                      --body "$(printf 'Weekly externals pin refresh.\n\n## Plan\nAdvance each pinned archive external to its newest upstream ref, checksums recomputed from the downloaded archives.\n\n## Changes\n- **Externals** `.chezmoiexternal.toml`: updated pins, see the diff.\n\n## Testing\n- [ ] validate workflow green (close and reopen this PR to trigger checks)\n\n## Release Notes\n- N/A\n')" \
                      --base main \
                      --head "$branch"
