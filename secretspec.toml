# SecretSpec manifest: the names of the private values and keys this setup
# expects. It holds no value, so it is safe in this public repository.
#
#   secretspec check            report what this machine has and what it lacks
#   secretspec set PROXY_HOST   store one value in your default provider
#
# Reference: https://secretspec.dev/reference/configuration/
[project]
name = "dotfiles"
revision = "1.0"

[providers]
# The keys below live in the plain file ~/.env today. To move one to a store,
# import it and give it another provider:
#   secretspec import dotenv://~/.env
home_env = "dotenv://~/.env"

[profiles.default]
# Private values. With the store choice secretspec, chezmoi init reads them
# into ~/.config/chezmoi/chezmoi.toml. tests/test-private-data.sh fails when a
# key of .chezmoidata/private.yaml has no name here.
GITLAB_HOST = { description = "Host name of the work GitLab", required = true }
PROXY_HOST = { description = "Host name of the local AI proxy", required = true }

# Keys that the shell reads at startup (dot_config/zsh/cliproxy.zsh and
# browserbase.zsh) and that rune and the Codex launcher read at launch.
CLIPROXY_API_KEY = { description = "Local AI proxy key for Claude Code and Grok", required = false, providers = ["home_env"] }
CLIPROXY_API_KEY_CODEX = { description = "Local AI proxy key for Codex", required = false, providers = ["home_env"] }
CLIPROXY_API_KEY_GEMINI = { description = "Local AI proxy key for Gemini", required = false, providers = ["home_env"] }
CLIPROXY_MGMT_KEY = { description = "Management key of the local AI proxy", required = false, providers = ["home_env"] }
BROWSERBASE_API_KEY = { description = "Browserbase key for the browse CLI", required = false, providers = ["home_env"] }
