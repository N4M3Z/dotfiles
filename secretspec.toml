# SecretSpec manifest: the names of the private values this setup expects. It
# holds no value, so it is safe in this public repository.
#
#   secretspec check            report what this machine has and what it lacks
#   secretspec set PROXY_HOST   store one value in your default provider
#
# The keys that the shell reads at startup (the hub client keys in
# dot_config/zsh/cliproxy.zsh and the Browserbase key in browserbase.zsh) are
# not here. runedeck/provision declares them with the rest of the machine's
# secrets and publishes that manifest at ~/.config/provision/secretspec.toml.
#
# Reference: https://secretspec.dev/reference/configuration/
[project]
name = "dotfiles"
revision = "1.0"

[profiles.default]
# Private values. With the store choice secretspec, chezmoi init reads them
# into ~/.config/chezmoi/chezmoi.toml. tests/test-private-data.sh fails when a
# key of .chezmoidata/private.yaml has no name here.
GITLAB_HOST = { description = "Host name of the work GitLab", required = true }
PROXY_HOST = { description = "Host name of the local AI proxy", required = true }
TAILNET_HOST = { description = "DNS name of the tailnet, such as tail1234.ts.net, with no machine name", required = true }
