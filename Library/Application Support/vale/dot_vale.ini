# User-level Vale configuration. Vale reads this file under every
# project .vale.ini it finds, and alone when a project has none, so
# every markdown file on this machine gets the deck styles. Lists such
# as BasedOnStyles gather across both files. A scalar such as
# MinAlertLevel takes the project's value. `vale ls-dirs` prints this
# path. `--no-global` leaves the file out of a run.
#
# The styles directory beside this file links to the deck styles, so
# one copy of each style serves every repo. A repo that needs its own
# rules keeps its own .vale.ini and StylesPath; both paths are searched.
StylesPath = styles
MinAlertLevel = suggestion

# Personal accept and reject lists live in
# styles/config/vocabularies/N4M3Z/. accept.txt extends the exception
# list of every enabled style. reject.txt flags each match as an error
# through Vale.Avoid, which runs only when the built-in Vale style is
# in BasedOnStyles. That style is off here because it also brings
# Vale.Spelling, which is noisy on technical prose.
Vocab = N4M3Z

[*.md]
BasedOnStyles = STE, Deslop, Core
# Core replaces two Deslop rules: NoEmDash allows no dash where
# EmDashOveruse allows one, and NegativeParallelism also catches the
# two-sentence "It is not X. It is Y." that NotJustScaffold misses.
Deslop.EmDashOveruse = NO
Deslop.NotJustScaffold = NO
